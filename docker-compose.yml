version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD:-Luck@492025}
      - DB_NAME=DeepGuard_AI
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-deepguard_secret_key_change_in_prod}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Exclude models from sync if they are huge and downloaded in build
      - /app/models

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Luck@492025}
      - MYSQL_DATABASE=DeepGuard_AI
    volumes:
      - db_data:/var/lib/mysql
      # Mount schema to initialize DB on first run
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
